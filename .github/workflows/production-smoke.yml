name: Production smoke (authenticated)

# بنية ضمان جودة فقط — تُشغَّل يدويًّا. لا تعمل على push/PR إطلاقًا.
# تتحقّق من مساحة عمل الحملة المُصادَقة على الإنتاج الحقيقي. الاستراتيجية:
# كلمة مرور عابرة تُولَّد لكل تشغيل، تُدوَّر بها كلمةُ مرور مدير بيئة العرض فقط عبر
# أمر QA ضيّق النطاق (preview:rotate-smoke-credential)، ثم تُستعمل للدخول فورًا ثم
# تُهمَل. لا كلمة مرور دائمة، ولا ملفّ اعتماد، ولا PREVIEW_PASSWORD، ولا إعادة بذر/
# تهيئة، ولا تعديل لأي مستخدم آخر أو بيانات أخرى. التغيير الوحيد: كلمة مرور
# showcase_admin@showcase.test.
on:
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Authenticated production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/crmv2' }}
      SMOKE_BASE_URL: https://influencerhub.io
      SHOWCASE_EMAIL: showcase_admin@showcase.test
    steps:
      - uses: actions/checkout@v4

      - name: Rotate ephemeral Showcase QA password (per-run, masked, never printed)
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set +x
          sudo apt-get update >/dev/null 2>&1 || true
          sudo apt-get install -y sshpass >/dev/null 2>&1 || true
          rssh() { sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$1"; }

          # كلمة مرور عشوائية قويّة تُولَّد لكل تشغيل فقط — لا تُخزَّن ولا تُطبع إطلاقًا.
          SMOKE_PASSWORD="$(openssl rand -base64 36 | tr -d '\n')"
          echo "::add-mask::$SMOKE_PASSWORD"

          # حاوية التطبيق لمشروع platform تحديدًا (على المضيف عدّة أطقم).
          APPC="$(rssh 'docker ps --format "{{.Names}}" | grep -E "^platform-app" | head -n1' 2>/dev/null | tr -d '\r\n' || true)"
          [ -z "$APPC" ] && APPC="platform-app-1"
          echo "app container = $APPC"

          # التغيير الوحيد: كلمة مرور مدير بيئة العرض عبر أمر QA ضيّق النطاق.
          # لا ملفّ اعتماد، لا PREVIEW_PASSWORD، لا إعادة بذر/تهيئة. السرّ يُمرَّر عبر -e
          # (مُقنَّع في السجلّات) ويُقرأ داخل الحاوية بـ getenv؛ مخرجات الأمر لا تحوي كلمة المرور.
          if ! rssh "docker exec -e PRODUCTION_SMOKE_PASSWORD='$SMOKE_PASSWORD' $APPC php artisan preview:rotate-smoke-credential --force"; then
            echo "ERROR: preview:rotate-smoke-credential failed on production."
            exit 1
          fi
          # نُمرّر نفس السرّ لـPlaywright (متغيّر مُقنَّع لهذا التشغيل فقط).
          printf 'SHOWCASE_PASSWORD=%s\n' "$SMOKE_PASSWORD" >> "$GITHUB_ENV"
          echo "Showcase QA password rotated for this run (masked)."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run authenticated production smoke
        env:
          SHOWCASE_PASSWORD: ${{ env.SHOWCASE_PASSWORD }}
        run: npx playwright test --config=playwright.smoke.config.js
