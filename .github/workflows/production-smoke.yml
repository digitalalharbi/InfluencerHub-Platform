name: Production smoke (authenticated)

# بنية ضمان جودة فقط — تُشغَّل يدويًّا. لا تعمل على push/PR إطلاقًا.
# تتحقّق من مساحة عمل الحملة المُصادَقة على الإنتاج الحقيقي باستخدام حساب بيئة
# العرض المُصرَّح به الموجود أصلًا، مُسترجَعًا بأمان (مُقنَّع، لا يُطبع في السجلّات).
# لا تُغيّر أي سلوك مصادقة، ولا تُنشئ بيانات إنتاج، ولا تُعدّل أي كلمة مرور.
on:
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Authenticated production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/crmv2' }}
      SMOKE_BASE_URL: https://influencerhub.io
      SHOWCASE_EMAIL: showcase_admin@showcase.test
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve Showcase credential securely (masked, never printed)
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set +x
          sudo apt-get update >/dev/null 2>&1 || true
          sudo apt-get install -y sshpass >/dev/null 2>&1 || true
          # دالّة SSH موحّدة (كلمة مرور VPS مُقنَّعة تلقائيًّا في سجلّات GitHub).
          rssh() { sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$1"; }

          # تشخيص آمن (لا أسرار): اتّصال SSH، أسماء الحاويات، وجود وحدة التخزين.
          echo "diag ssh = $(rssh 'echo OK' 2>/dev/null || echo FAIL)"
          echo "diag containers = $(rssh 'docker ps --format "{{.Names}}" 2>/dev/null | tr "\n" ","' 2>/dev/null || echo ERR)"
          echo "diag volumes = $(rssh 'docker volume ls --format "{{.Name}}" 2>/dev/null | grep -i app_storage | tr "\n" ","' 2>/dev/null || echo ERR)"

          # مسار مطلق داخل الحاوية (workdir=/app؛ وحدة التخزين على /app/storage/app).
          FILE_ABS='/app/storage/app/private/showcase-credentials.txt'
          # حاوية التطبيق لمشروع docker المُسمّى platform تحديدًا (على المضيف عدّة أطقم).
          APPC="$(rssh 'docker ps --format "{{.Names}}" | grep -E "^platform-app" | head -n1' 2>/dev/null | tr -d '\r\n' || true)"
          [ -z "$APPC" ] && APPC="platform-app-1"
          echo "diag app_container = ${APPC:-none}"
          # تشخيص آمن: أسماء الملفّات في مجلّد private (لا محتوى) لتأكيد وجود الملف.
          echo "diag private_dir = $(rssh "docker exec $APPC sh -c 'ls /app/storage/app/private 2>/dev/null' | tr '\n' ','" 2>/dev/null || echo ERR)"
          # القراءة: مسار مطلق + sh -c (لا -l حتى لا يتغيّر مجلّد العمل). لا يُطبع المحتوى.
          CONTENT="$(rssh "docker exec $APPC sh -c 'cat $FILE_ABS' 2>/dev/null" 2>/dev/null || true)"
          echo "diag creds_found = $([ -n "$CONTENT" ] && echo yes || echo no)"

          # نستخرج سطر كلمة المرور فقط ثم نُقنّعه فورًا (لا يُطبع المحتوى إطلاقًا).
          PW="$(printf '%s\n' "$CONTENT" | sed -n 's/^# [^:]*: //p' | head -n1 | tr -d '\r\n')"
          if [ -z "$PW" ]; then
            # مصدر بديل: PREVIEW_PASSWORD من بيئة الخادم إن كانت هي مصدر الحقيقة الفعلي.
            PW="$(rssh "cd '$VPS_APP_DIR' && grep -E '^PREVIEW_PASSWORD=' deploy/vps/.env" 2>/dev/null | cut -d= -f2- | tr -d '\r\n' || true)"
            echo "diag preview_pw_fallback = $([ -n "$PW" ] && echo used || echo empty)"
          fi
          if [ -z "$PW" ]; then
            echo "ERROR: could not retrieve the Showcase credential from the VPS (see diag lines above)."
            exit 1
          fi
          echo "::add-mask::$PW"
          printf 'SHOWCASE_PASSWORD=%s\n' "$PW" >> "$GITHUB_ENV"
          echo "Showcase credential retrieved and masked."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run authenticated production smoke
        env:
          SHOWCASE_PASSWORD: ${{ env.SHOWCASE_PASSWORD }}
        run: npx playwright test --config=playwright.smoke.config.js
